<!-- PWA Manifest inline -->
<script>
const manifestData = {
  name: "NUTRYX – AI Health Tracker",
  short_name: "NUTRYX",
  description: "AI-powered nutrition, workout, water & weight tracker",
  start_url: "./",
  display: "standalone",
  background_color: "#080d14",
  theme_color: "#3b82f6",
  orientation: "portrait",
  icons: [
    { src: "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='100' fill='%23080d14'/%3E%3Ctext x='256' y='340' text-anchor='middle' font-size='280' font-family='system-ui,sans-serif' font-weight='900' fill='%233b82f6'%3EN%3C/text%3E%3C/svg%3E", sizes: "512x512", type: "image/svg+xml", purpose: "any maskable" }
  ]
};
const blob = new Blob([JSON.stringify(manifestData)], {type:'application/json'});
const manifestURL = URL.createObjectURL(blob);
document.addEventListener('DOMContentLoaded', () => {
  const link = document.createElement('link');
  link.rel = 'manifest'; link.href = manifestURL;
  document.head.appendChild(link);
});
</script>

const store={
  get(k){try{const v=localStorage.getItem(`nutryx:${k}`);return v?JSON.parse(v):null;}catch{return null;}},
  set(k,v){try{localStorage.setItem(`nutryx:${k}`,JSON.stringify(v));}catch{}},

// ── Claude AI (proxied) ───────────────────────────────────────────────────────
// Calls /api/ai on the same origin so API keys are not exposed in the browser.
async function ai(prompt,system="Respond only with valid JSON.",img=null,imgType="image/jpeg"){ 
  try{
    const payload = { prompt, system, img, imgType };
    const res = await fetch('/api/ai', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
    if(!res.ok){ const txt = await res.text(); throw new Error('AI proxy error: '+txt); }
    const d = await res.json();
    if(d && typeof d.text === 'string') return d.text.replace(/```json|```/g,"").trim();
    if(d && d.raw){
      const raw = d.raw;
      const text = raw?.content?.find?.(b=>b.type==="text")?.text || raw?.completion || raw?.message || JSON.stringify(raw);
      return String(text).replace(/```json|```/g,"").trim();
    }
    return '';
  }catch(err){
    console.error('AI request failed',err);
    throw err;
  }
}

// ── Food DB Search ───────────────────────────────────────────────────────────
// USDA API key moved to server-side proxy. Do NOT store API keys in client code.
const USDA_KEY = null;
function extractUSDA(food){
  const get=(id)=>{const n=food.foodNutrients?.find(x=>(x.nutrientId||x.nutrient?.id)===id);return +(n?.value||n?.amount||0).toFixed(1);};
  return{source:"usda",found:true,name:food.description||"Unknown",brand:food.brandOwner||food.brandName||"",
    serving:`${food.servingSize||100}${food.servingSizeUnit||"g"}`,fdcId:food.fdcId,
    perServing:{cal:get(1008),protein:get(1003),carbs:get(1005),fat:get(1004),fiber:get(1079),sugar:get(2000),sodium:get(1093)}};
}
function extractOFF(p){
  const n=p.nutriments||{};
  return{source:"openfoodfacts",found:true,name:p.product_name||"Unknown",brand:p.brands||"",
    image:p.image_front_small_url||null,serving:p.serving_size||"100g",nutriscore:p.nutriscore_grade?.toUpperCase()||null,
    perServing:{cal:Math.round(n["energy-kcal_serving"]||n["energy-kcal_100g"]||0),protein:+(n["proteins_serving"]||n["proteins_100g"]||0).toFixed(1),
      carbs:+(n["carbohydrates_serving"]||n["carbohydrates_100g"]||0).toFixed(1),fat:+(n["fat_serving"]||n["fat_100g"]||0).toFixed(1),
      fiber:+(n["fiber_serving"]||n["fiber_100g"]||0).toFixed(1),sugar:+(n["sugars_serving"]||n["sugars_100g"]||0).toFixed(1),
      sodium:+((n["sodium_serving"]||n["sodium_100g"]||0)*1000).toFixed(0)}};
}
async function searchUSDA(q){
  try{
    const res = await fetch('/api/usda/search', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({q,pageSize:12})});
    if(!res.ok){ console.warn('USDA proxy error', await res.text()); return []; }
    const d = await res.json();
    return (d.foods||[]).map(extractUSDA);
  }catch(err){ console.warn('searchUSDA error',err); return []; }
}
async function searchOFF(q){try{const r=await fetch(`https://world.openfoodfacts.org/cgi/search.pl?search_terms=${encodeURIComponent(q)}&json=1&page_size=8&fields=product_name,brands,nutriments,serving_size,nutriscore_grade,image_front_small_url`);const d=await r.json();return(d.products||[]).filter(p=>p.product_name).map(extractOFF);}catch{return[];}}
async function lookupBarcode(barcode){
  const cached=store.get(`food:bc:${barcode}`);if(cached)return{...cached,found:true,source:"local-db"};
  try{const r=await fetch(`https://world.openfoodfacts.org/api/v2/product/${barcode}.json`);const d=await r.json();
    if(d.status===1&&d.product){const prod=extractOFF(d.product);prod.barcode=barcode;store.set(`food:bc:${barcode}`,prod);return prod;}}catch{}
  return{found:false};
}

// ── Hint / Tooltip system ─────────────────────────────────────────────────────
// Global state: only one hint open at a time
let _activeHintClose = null;

function Hint({title,children,icon="💡",color=T.amber}){
  const[open,setOpen]=useState(false);
  const[pos,setPos]=useState({top:0,left:0,right:"auto",transformOrigin:"top left"});
  const btnRef=useRef(null);

  const toggle=()=>{
    if(open){setOpen(false);_activeHintClose=null;return;}
    // Close any other open hint
    if(_activeHintClose)_activeHintClose();
    // Calculate position relative to button
    if(btnRef.current){
      const rect=btnRef.current.getBoundingClientRect();
      const vw=window.innerWidth;
      const vh=window.innerHeight;
      const boxW=Math.min(280,vw-32);
      const spaceRight=vw-rect.right-8;
      const spaceLeft=rect.left-8;
      const spaceBelow=vh-rect.bottom-8;
      const spaceAbove=rect.top-8;

      let left,top,transformOrigin;

      // Horizontal: prefer right of button, flip to left if not enough space
      if(spaceRight>=boxW){
        left=rect.right+8;
        transformOrigin="top left";
      } else if(spaceLeft>=boxW){
        left=rect.left-boxW-8;
        transformOrigin="top right";
      } else {
        // Center aligned
        left=Math.max(16,Math.min(rect.left-boxW/2+13,vw-boxW-16));
        transformOrigin="top center";
      }

      // Vertical: prefer below button, flip above if not enough space
      if(spaceBelow>=120){
        top=rect.bottom+6;
      } else if(spaceAbove>=120){
        top=rect.top-6; // will use translateY(-100%)
        transformOrigin=transformOrigin.replace("top","bottom");
      } else {
        top=Math.max(60,rect.top-80);
      }

      setPos({top,left,width:boxW,transformOrigin,flipY:spaceBelow<120&&spaceAbove>=120});
    }
    setOpen(true);
    _activeHintClose=()=>setOpen(false);
  };

  // Close on outside click
  useEffect(()=>{
    if(!open)return;
    const handler=(e)=>{if(btnRef.current&&!btnRef.current.closest('[data-hint]')?.contains(e.target)){setOpen(false);_activeHintClose=null;}};
    setTimeout(()=>document.addEventListener("click",handler),10);
    return()=>document.removeEventListener("click",handler);
  },[open]);

  return(
    <div data-hint="1" style={{display:"inline-flex",alignItems:"center",position:"relative"}}>
      <button ref={btnRef} onClick={toggle}
        style={{background:open?`${color}33`:`${color}15`,border:`1px solid ${color}${open?"88":"44"}`,borderRadius:20,
          width:26,height:26,display:"flex",alignItems:"center",justifyContent:"center",
          cursor:"pointer",fontSize:12,fontWeight:800,color,flexShrink:0,transition:"all 0.15s",
          boxShadow:open?`0 0 0 3px ${color}22`:"none"}}>?</button>

      {open&&(
        <>
          {/* Invisible backdrop */}
          <div onClick={()=>{setOpen(false);_activeHintClose=null;}} style={{position:"fixed",inset:0,zIndex:298}}/>
          {/* Popup box */}
          <div style={{
            position:"fixed",
            top:pos.top,
            left:pos.left,
            width:pos.width,
            zIndex:299,
            background:T.surface,
            border:`1.5px solid ${color}88`,
            borderRadius:14,
            padding:"14px 16px",
            boxShadow:`0 8px 32px rgba(0,0,0,0.7), 0 0 0 1px ${color}22`,
            transform:pos.flipY?"translateY(-100%)":"none",
            transformOrigin:pos.transformOrigin,
            animation:"hintPop 0.18s cubic-bezier(.34,1.56,.64,1) both",
          }}>
            {/* Arrow pointer toward button */}
            <div style={{
              position:"absolute",
              width:10,height:10,
              background:T.surface,
              border:`1.5px solid ${color}88`,
              transform:"rotate(45deg)",
              ...(pos.flipY
                ? {bottom:-6, left:pos.left>btnRef.current?.getBoundingClientRect().right?"auto":12, borderTop:"none",borderLeft:"none"}
                : {top:-6, left:pos.left>btnRef.current?.getBoundingClientRect().right?"auto":12, borderBottom:"none",borderRight:"none"}
              ),
            }}/>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
              <div style={{display:"flex",alignItems:"center",gap:8}}>
                <span style={{fontSize:18}}>{icon}</span>
                <span style={{fontWeight:800,color:T.text,fontSize:14}}>{title}</span>
              </div>
              <button onClick={()=>{setOpen(false);_activeHintClose=null;}}
                style={{background:T.surfaceHigh,border:"none",color:T.textMuted,fontSize:16,cursor:"pointer",
                  lineHeight:1,width:24,height:24,borderRadius:6,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>✕</button>
            </div>
            <div style={{color:T.textMuted,fontSize:13,lineHeight:1.7,whiteSpace:"pre-line"}}>{children}</div>
          </div>
        </>
      )}
    </div>
  );
}

    {icon:"🏆",title:L('tour_step8_title'),desc:L('tour_step8_desc')},

  const s=steps[step];
  return(
    <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.85)",zIndex:500,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"flex-end",padding:"0 20px 40px"}}>

          <button onClick={onDone} style={{background:"none",border:"none",color:T.textMuted,fontSize:13,cursor:"pointer",fontWeight:600}}>{L('tourSkip')}</button>

          {steps.map((_,i)=><div key={i} style={{flex:1,height:3,borderRadius:2,background:i<=step?T.accent:T.accentDim,transition:"background 0.3s"}}/>)}
        </div>
        <div style={{fontSize:40,marginBottom:12}}>{s.icon}</div>

        <div style={{fontSize:15,color:T.textMuted,lineHeight:1.7,marginBottom:24}}>{s.desc}</div>
        <div style={{display:"flex",gap:12}}>
          {step>0&&<button onClick={()=>setStep(s=>s-1)} style={{flex:1,background:T.surfaceHigh,border:`1px solid ${T.border}`,color:T.text,borderRadius:14,padding:"14px",fontWeight:700,cursor:"pointer",fontSize:15}}>{L('tourBack')}</button>}

}

            </div>

// ── Barcode Scanner ──────────────────────────────────────────────────────────
function BarcodeScanner({onResult,onClose}){
  const videoRef=useRef(null),streamRef=useRef(null),intervalRef=useRef(null),canvasRef=useRef(document.createElement("canvas"));
  const[status,setStatus]=useState("starting"),[manual,setManual]=useState(""),[hint,setHint]=useState(L('barcodeHint')||"Point camera at barcode");
  const stop=useCallback(()=>{
    clearInterval(intervalRef.current);
    if(streamRef.current){streamRef.current.getTracks().forEach(t=>t.stop());streamRef.current=null;}
  },[]);

  useEffect(()=>{
    let ok=true;
    const startCam=async()=>{
      try{
        // Request highest resolution for better scanning on iPhone
        const s=await navigator.mediaDevices.getUserMedia({video:{facingMode:{exact:"environment"},width:{ideal:1920},height:{ideal:1080}}}).catch(()=>
          navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"}}));
        if(!ok){s.getTracks().forEach(t=>t.stop());return;}
        streamRef.current=s;
        if(videoRef.current){videoRef.current.srcObject=s;await videoRef.current.play();setStatus("scanning");}
      }catch(e){setStatus("no-camera");}
    };
    startCam();
    return()=>{ok=false;stop();};
  },[stop]);

  // iPhone-optimized scanning: try multiple libs with fallback
  useEffect(()=>{
    if(status!=="scanning")return;
    let frameCount=0;
    const scan=async()=>{
      const v=videoRef.current;if(!v||v.readyState<2)return;
      frameCount++;
      // Update hint periodically to guide user
      if(frameCount===15)setHint("Hold steady, make sure barcode is well lit 💡");
      if(frameCount===40)setHint("Try moving closer to the barcode 🔍");
      if(frameCount===70)setHint("Try angling the camera slightly 📐");
      const c=canvasRef.current;
      c.width=v.videoWidth;c.height=v.videoHeight;
      const ctx=c.getContext("2d");
      ctx.drawImage(v,0,0);

      // Method 1: Try BarcodeDetector API (native iOS 17+ / Chrome)
      if(window.BarcodeDetector){
        try{
          const bd=new window.BarcodeDetector({formats:["ean_13","ean_8","upc_a","upc_e","code_128","code_39","qr_code","itf","codabar"]});
          const codes=await bd.detect(c);
          if(codes.length>0){stop();onResult(codes[0].rawValue);return;}
        }catch{}
      }

      // Method 2: ZXing
      if(window.ZXing){
        try{
          const reader=new window.ZXing.BrowserMultiFormatReader();
          // Try multiple hints for better detection
          const hints=new Map();
          hints.set(window.ZXing.DecodeHintType?.TRY_HARDER,[true]);
          const imgData=c.toDataURL("image/png");
          const result=await reader.decodeFromImageUrl(imgData);
          if(result){stop();onResult(result.getText());return;}
        }catch{}
      }

      // Method 3: QuaggaJS
      if(window.Quagga){
        try{
          const imgData=c.toDataURL("image/jpeg",0.9);
          window.Quagga.decodeSingle({src:imgData,numOfWorkers:0,inputStream:{size:800},decoder:{readers:["ean_reader","ean_8_reader","upc_reader","upc_e_reader","code_128_reader","code_39_reader"]}},r=>{
            if(r&&r.codeResult){stop();onResult(r.codeResult.code);}
          });
        }catch{}
      }
    };

    // Load all scanning libraries
    const loadLib=(src)=>new Promise(res=>{if(document.querySelector(`script[src="${src}"]`)){res();return;}const s=document.createElement("script");s.src=src;s.onload=res;s.onerror=res;document.head.appendChild(s);});
    Promise.all([
      loadLib("https://cdnjs.cloudflare.com/ajax/libs/zxing-js/0.20.0/zxing.min.js"),
      loadLib("https://cdnjs.cloudflare.com/ajax/libs/quagga/0.12.1/quagga.min.js"),
    ]).then(()=>{
      intervalRef.current=setInterval(scan,400);
    });
    return()=>clearInterval(intervalRef.current);
  },[status,onResult,stop]);
  return(
    <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.96)",zIndex:200,display:"flex",flexDirection:"column",padding:"env(safe-area-inset-top) 20px 20px"}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"16px 0"}}>
        <span style={{fontWeight:800,fontSize:18,color:T.accent}}>📷 Scan Barcode</span>
        <button onClick={()=>{stop();onClose();}} style={{background:T.surfaceHigh,border:`1px solid ${T.border}`,color:T.text,borderRadius:10,padding:"8px 16px",fontWeight:700,cursor:"pointer",fontSize:14}}>Close</button>
      </div>
      <div style={{position:"relative",borderRadius:20,overflow:"hidden",background:"#000",flex:1,maxHeight:"55vh",border:`2px solid ${T.accent}44`}}>
        <video ref={videoRef} muted playsInline style={{width:"100%",height:"100%",objectFit:"cover"}}/>
        {status==="scanning"&&<div style={{position:"absolute",inset:0,display:"flex",alignItems:"center",justifyContent:"center",pointerEvents:"none"}}>
          <div style={{width:"75%",height:"28%",position:"relative"}}>
            {[{top:0,left:0,borderTop:`3px solid ${T.accent}`,borderLeft:`3px solid ${T.accent}`},{top:0,right:0,borderTop:`3px solid ${T.accent}`,borderRight:`3px solid ${T.accent}`},{bottom:0,left:0,borderBottom:`3px solid ${T.accent}`,borderLeft:`3px solid ${T.accent}`},{bottom:0,right:0,borderBottom:`3px solid ${T.accent}`,borderRight:`3px solid ${T.accent}`}].map((s,i)=><div key={i} style={{position:"absolute",width:28,height:28,...s}}/>)}
            <div style={{position:"absolute",left:0,right:0,height:2,background:`linear-gradient(90deg,transparent,${T.accent},transparent)`,boxShadow:`0 0 8px ${T.accent}`,animation:"scanLine 1.8s ease-in-out infinite"}}/>
          </div>
          <div style={{position:"absolute",bottom:20,left:0,right:0,textAlign:"center"}}>
            <div style={{background:"rgba(0,0,0,0.7)",color:T.text,fontSize:13,padding:"8px 16px",borderRadius:20,display:"inline-block"}}>{hint}</div>
          </div>
        </div>}
        {status==="starting"&&<div style={{position:"absolute",inset:0,display:"flex",alignItems:"center",justifyContent:"center",color:T.textMuted,fontSize:14}}>Starting camera…</div>}
        {status==="no-camera"&&<div style={{position:"absolute",inset:0,display:"flex",alignItems:"center",justifyContent:"center",flexDirection:"column",gap:12,padding:24,textAlign:"center"}}><span style={{fontSize:48}}>📵</span><span style={{color:T.textMuted,fontSize:14}}>Camera unavailable — use manual entry below</span></div>}
      </div>
      <div style={{marginTop:16}}>
        <div style={{fontSize:12,color:T.textMuted,fontWeight:700,letterSpacing:1,marginBottom:10}}>ENTER BARCODE MANUALLY</div>
        <div style={{display:"flex",gap:10}}>
          <Input value={manual} onChange={e=>setManual(e.target.value)} onKeyDown={e=>e.key==="Enter"&&manual.trim()&&(stop(),onResult(manual.trim()))} placeholder="e.g. 8410076901033" type="number"/>
          <Btn onClick={()=>manual.trim()&&(stop(),onResult(manual.trim()))} style={{flexShrink:0,whiteSpace:"nowrap"}}>Look Up</Btn>
        </div>
      </div>
    </div>
  );
}

// ── Photo Scanner ────────────────────────────────────────────────────────────
function PhotoScanner({onResult,onClose}){
  const fileRef=useRef(null),videoRef=useRef(null),streamRef=useRef(null);
  const[mode,setMode]=useState("choose"),[preview,setPreview]=useState(null),[pType,setPType]=useState("image/jpeg"),[busy,setBusy]=useState(false),[err,setErr]=useState("");
  const stop=useCallback(()=>{streamRef.current?.getTracks().forEach(t=>t.stop());streamRef.current=null;},[]);

  const capture=()=>{if(!videoRef.current)return;const c=document.createElement("canvas");c.width=videoRef.current.videoWidth;c.height=videoRef.current.videoHeight;c.getContext("2d").drawImage(videoRef.current,0,0);stop();setPreview(c.toDataURL("image/jpeg",0.9));setPType("image/jpeg");setMode("preview");};

        <Btn onClick={startCam} color={T.cyan} style={{width:"100%"}}>📷 Take Photo</Btn>
        <OutlineBtn onClick={()=>fileRef.current?.click()} style={{width:"100%"}}>🖼️ Upload from Gallery</OutlineBtn>

        {err&&<div style={{color:T.red,fontSize:13,textAlign:"center",padding:10}}>{err}</div>}
      </div>}
      {mode==="camera"&&<div style={{display:"flex",flexDirection:"column",gap:12,flex:1}}>
        <div style={{position:"relative",borderRadius:20,overflow:"hidden",background:"#000",flex:1,maxHeight:"55vh",border:`2px solid ${T.cyan}66`}}>
          <video ref={videoRef} muted playsInline style={{width:"100%",height:"100%",objectFit:"cover"}}/>
          <div style={{position:"absolute",inset:0,display:"flex",alignItems:"center",justifyContent:"center",pointerEvents:"none"}}>
            <div style={{width:"85%",height:"80%",border:`2px dashed ${T.cyan}66`,borderRadius:16,display:"flex",alignItems:"center",justifyContent:"center"}}>
              <span style={{color:`${T.cyan}88`,fontSize:13,background:"rgba(0,0,0,0.6)",padding:"6px 14px",borderRadius:10}}>Point at label or front</span>
            </div>

      {mode==="preview"&&<div style={{display:"flex",flexDirection:"column",gap:12}}>

        :<><Btn onClick={analyze} color={T.cyan} style={{width:"100%"}}>✨ Analyze with AI</Btn><OutlineBtn onClick={()=>{setPreview(null);setMode("choose");setErr("");}} style={{width:"100%"}}>← Retake</OutlineBtn></>}

// ── Food Search ───────────────────────────────────────────────────────────────
function FoodSearch({onAdd,profile}){
  const[query,setQuery]=useState(""),[results,setResults]=useState([]),[busy,setBusy]=useState(false);
  const[selected,setSelected]=useState(null),[servings,setServings]=useState(1);
  const[cat,setCat]=useState(null),[recent,setRecent]=useState([]);
  const debRef=useRef(null);
  useEffect(()=>{setRecent(store.get("recent-foods")||[]);}, []);
  const search=useCallback(async(q)=>{
    if(!q.trim()){setResults([]);return;}setBusy(true);
    const cached=store.get(`search:${q.toLowerCase()}`);
    if(cached&&Date.now()-cached.ts<3600000){setResults(cached.data);setBusy(false);return;}
    const[u,o]=await Promise.all([searchUSDA(q),searchOFF(q)]);
    const merged=[...u,...o].filter((v,i,a)=>a.findIndex(x=>x.name===v.name)===i);
    store.set(`search:${q.toLowerCase()}`,{data:merged,ts:Date.now()});
    setResults(merged);setBusy(false);
  },[]);
  useEffect(()=>{clearTimeout(debRef.current);if(!query.trim()){setResults([]);return;}debRef.current=setTimeout(()=>search(query),400);return()=>clearTimeout(debRef.current);},[query,search]);
  const loadCat=async(c)=>{setCat(c.id);setQuery(c.q);await search(c.q);};
  const selectFood=(f)=>{setSelected(f);setServings(1);};
  const addFood=()=>{if(!selected)return;const p=selected.perServing;
    const item={name:`${selected.name}${selected.brand?` (${selected.brand})`:""}`,cal:Math.round(p.cal*servings),protein:+(p.protein*servings).toFixed(1),carbs:+(p.carbs*servings).toFixed(1),fat:+(p.fat*servings).toFixed(1)};
    onAdd(item);const rf=[selected,...(recent||[]).filter(f=>f.name!==selected.name)].slice(0,10);setRecent(rf);store.set("recent-foods",rf);
    store.set(`food:n:${selected.name.toLowerCase().replace(/\s+/g,"-")}`,{...selected,savedAt:Date.now()});setSelected(null);};
  const srcColor={usda:T.green,openfoodfacts:T.accent,ai:T.amber,"local-db":T.purple};
  const srcLabel={usda:"USDA",openfoodfacts:"Branded",ai:"AI","local-db":"Saved"};
  const nc={A:"#037d3a",B:"#85bb2f",C:"#fecb02",D:"#ee8100",E:"#e63e11"};
  return(
    <div style={{display:"flex",flexDirection:"column",gap:14}}>
      {/* Search box */}
      <div style={{position:"relative"}}>
        <span style={{position:"absolute",left:14,top:"50%",transform:"translateY(-50%)",fontSize:18,color:T.textMuted,pointerEvents:"none"}}>🔍</span>
        <input value={query} onChange={e=>{setQuery(e.target.value);setSelected(null);}} placeholder="Search 300,000+ foods…"
          style={{width:"100%",background:T.surfaceHigh,border:`1px solid ${T.border}`,borderRadius:14,padding:"14px 44px",color:T.text,fontSize:16,outline:"none"}}/>
        {query&&<button onClick={()=>{setQuery("");setResults([]);setSelected(null);}} style={{position:"absolute",right:14,top:"50%",transform:"translateY(-50%)",background:"none",border:"none",color:T.textMuted,cursor:"pointer",fontSize:20,lineHeight:1}}>✕</button>}
      </div>
      {/* Category chips */}
      <div style={{display:"flex",gap:8,overflowX:"auto",paddingBottom:4}}>
        {CATS.map(c=><button key={c.id} onClick={()=>loadCat(c)}
          style={{background:cat===c.id?T.accentDim:"transparent",color:cat===c.id?T.accent:T.textMuted,border:`1px solid ${cat===c.id?T.accent:T.border}`,borderRadius:20,padding:"8px 16px",fontSize:13,fontWeight:600,cursor:"pointer",whiteSpace:"nowrap",flexShrink:0,transition:"all 0.2s"}}>
          {c.l}</button>)}
      </div>
      {/* Selected detail */}
      {selected&&<div style={{background:T.accentGlow,border:`1px solid ${T.accentDim}`,borderRadius:14,padding:"16px"}}>
        <div style={{fontWeight:800,color:T.text,fontSize:16,marginBottom:4}}>{selected.name}</div>
        {selected.brand&&<div style={{color:T.textMuted,fontSize:13,marginBottom:10}}>{selected.brand}</div>}
        <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:8,marginBottom:14}}>
          {[{l:"Cal",v:selected.perServing.cal,u:"kcal",c:T.accent},{l:"Protein",v:selected.perServing.protein,u:"g",c:T.cyan},{l:"Carbs",v:selected.perServing.carbs,u:"g",c:T.amber},{l:"Fat",v:selected.perServing.fat,u:"g",c:T.red},{l:"Fiber",v:selected.perServing.fiber||0,u:"g",c:T.purple},{l:"Sodium",v:selected.perServing.sodium||0,u:"mg",c:T.orange}].map(m=>(
            <div key={m.l} style={{background:T.surfaceHigh,borderRadius:10,padding:"10px 8px",textAlign:"center"}}>
              <div style={{fontSize:15,fontWeight:800,color:m.c}}>{+(m.v*servings).toFixed(1)}<span style={{fontSize:10,color:T.textMuted}}>{m.u}</span></div>
              <div style={{fontSize:11,color:T.textMuted}}>{m.l}</div>
            </div>
          ))}
        </div>
        <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:14}}>
          <span style={{color:T.textMuted,fontSize:14,fontWeight:600}}>Servings:</span>

            <span style={{color:T.text,fontWeight:800,fontSize:20,minWidth:36,textAlign:"center"}}>{servings}</span>
            <button onClick={()=>setServings(s=>+(s+0.25).toFixed(2))} style={{background:"none",border:"none",color:T.accent,fontSize:24,cursor:"pointer",fontWeight:700}}>+</button>
          </div>
          <span style={{color:T.textMuted,fontSize:13}}>{Math.round(selected.perServing.cal*servings)} kcal</span>
        </div>
        <div style={{display:"flex",gap:10}}>
          <Btn onClick={addFood} style={{flex:1}}>✓ Add to Log</Btn>

        </div>
      </div>}
      {/* Busy */}
      {busy&&!selected&&<div style={{textAlign:"center",padding:"24px 0",color:T.textMuted}}><div style={{fontSize:32,animation:"spin 1s linear infinite",display:"inline-block"}}>🔍</div><div style={{fontSize:14,marginTop:8}}>Searching databases…</div></div>}
      {/* Recent */}
      {!query&&!busy&&recent.length>0&&!selected&&<div>
        <SectionLabel>🕐 RECENTLY LOGGED</SectionLabel>
        {recent.slice(0,5).map((f,i)=>(
          <div key={i} onClick={()=>selectFood(f)} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"14px",background:T.surfaceHigh,borderRadius:12,cursor:"pointer",marginBottom:8,border:`1px solid transparent`}}>
            <div><div style={{fontWeight:600,color:T.text,fontSize:15}}>{f.name}</div>{f.brand&&<div style={{fontSize:12,color:T.textMuted,marginTop:2}}>{f.brand}</div>}</div>
            <div style={{textAlign:"right"}}><div style={{color:T.accent,fontWeight:700}}>{f.perServing?.cal} kcal</div><div style={{fontSize:12,color:T.textMuted}}>{f.perServing?.protein}g P</div></div>
          </div>
        ))}
      </div>}
      {/* Results */}
      {results.length>0&&!selected&&<div>
        <SectionLabel>{results.length} RESULTS</SectionLabel>
        {results.map((f,i)=>(
          <div key={i} onClick={()=>selectFood(f)} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"14px",background:T.surfaceHigh,borderRadius:12,cursor:"pointer",marginBottom:8,border:`1px solid transparent`}}>
            <div style={{flex:1,minWidth:0}}>
              <div style={{fontWeight:600,color:T.text,fontSize:15,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{f.name}</div>
              <div style={{display:"flex",gap:6,marginTop:4,alignItems:"center"}}>

                {f.nutriscore&&<span style={{background:nc[f.nutriscore]||"#555",color:"#fff",borderRadius:4,padding:"1px 5px",fontSize:10,fontWeight:700}}>NS-{f.nutriscore}</span>}
              </div>

              <div style={{color:T.accent,fontWeight:800,fontSize:15}}>{f.perServing?.cal}<span style={{fontSize:10,color:T.textMuted}}>kcal</span></div>
              <div style={{fontSize:12,color:T.textMuted}}>{f.perServing?.protein}g P</div>
            </div>
          </div>
        ))}
      </div>}
      {!busy&&query&&results.length===0&&!selected&&<div style={{textAlign:"center",padding:"30px 0",color:T.textMuted}}>
        <div style={{fontSize:36,marginBottom:10}}>🔍</div><div style={{fontSize:14}}>No results for "<b style={{color:T.text}}>{query}</b>"</div>
      </div>}
      {!query&&!busy&&<div style={{padding:"14px",background:T.accentGlow,borderRadius:12,border:`1px solid ${T.accentDim}`,fontSize:13,color:T.textMuted,display:"flex",gap:10,alignItems:"flex-start"}}>
        <span style={{fontSize:18,flexShrink:0}}>ℹ️</span>
        <span><b style={{color:T.text}}>300,000+</b> USDA foods · <b style={{color:T.text}}>3M+</b> branded products · AI fallback</span>

  const macroScore=Math.round((Math.min(totals.cal,profile.calGoal||2000)/(profile.calGoal||2000)*40)+(Math.min(totals.protein,profile.proteinGoal||150)/(profile.proteinGoal||150)*40)+((totals.fat<(profile.calGoal||2000)*0.35/9)?20:0));
  const analyzeText=async()=>{if(!textInput.trim())return;setBusy(true);setAiResult(null);
    try{const t=await ai(`Analyze meal:"${textInput}". Return JSON:{"name":"...","cal":0,"protein":0,"carbs":0,"fat":0,"fiber":0,"insight":"one health tip"}`);setAiResult(JSON.parse(t));}
    catch{setAiResult({name:textInput,cal:400,protein:20,carbs:45,fat:15,fiber:3,insight:"Balanced meal."});}setBusy(false);};
  const handleBarcode=async(bc)=>{setShowBarcode(false);setBusy(true);setScanErr("");setScanned(null);setScanType("barcode");
    const r=await lookupBarcode(bc);if(r.found){setScanned(r);setMode("scan");onBadge("first_scan");}else{setScanErr(`Not found: ${bc}. Try Photo Scan!`);setMode("text");}setBusy(false);};
  const handlePhoto=async(r)=>{setShowPhoto(false);store.set(`food:n:${(r.name||"").toLowerCase().replace(/\s+/g,"-")}`,{...r,source:"ai-photo",savedAt:Date.now()});
    setScanned({...r,source:"ai-photo",serving:r.serving||"1 serving",perServing:{cal:r.perServing?.cal||0,protein:r.perServing?.protein||0,carbs:r.perServing?.carbs||0,fat:r.perServing?.fat||0,fiber:r.perServing?.fiber||0,sugar:r.perServing?.sugar||0,sodium:r.perServing?.sodium||0}});
    setScanType("photo");setMode("scan");onBadge("first_scan");};
  const saveTemplate=()=>{if(!aiResult)return;const t=[...templates,{...aiResult,id:Date.now()}];setTemplates(t);store.set("templates",t);};
  const addMeal=(m)=>{onAdd(m);if(meals.length>=4)onBadge("meal_log5");};
  const MODES=[{id:"search",l:"🔍 Search"},{id:"text",l:"✏️ AI"},{id:"barcode",l:"📷 Scan"},{id:"photo",l:"📸 Photo"}];
  return(
    <div style={{display:"flex",flexDirection:"column",gap:14}}>
      {showBarcode&&<BarcodeScanner onResult={handleBarcode} onClose={()=>setShowBarcode(false)}/>}
      {showPhoto&&<PhotoScanner onResult={handlePhoto} onClose={()=>setShowPhoto(false)}/>}
      {/* Macro rings */}
      <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:8}}>
        {[{l:"Calories",v:totals.cal,g:profile.calGoal||2000,c:T.accent,u:"kcal"},{l:"Protein",v:totals.protein,g:profile.proteinGoal||150,c:T.cyan,u:"g"},{l:"Carbs",v:totals.carbs,g:250,c:T.amber,u:"g"},{l:"Fat",v:totals.fat,g:65,c:T.red,u:"g"}].map(m=>(
          <Card key={m.l} style={{textAlign:"center",padding:"12px 6px"}}>
            <div style={{display:"flex",justifyContent:"center"}}><Ring pct={Math.min(100,(m.v/m.g)*100)} color={m.c} size={60}/></div>
            <div style={{marginTop:6,fontSize:14,fontWeight:800,color:T.text}}>{m.v}<span style={{fontSize:9,color:T.textMuted}}>{m.u}</span></div>
            <div style={{fontSize:10,color:T.textMuted}}>{m.l}</div>
          </Card>
        ))}
      </div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
        <Card style={{padding:"12px 14px"}}>
          <div style={{display:"flex",alignItems:"center",gap:6}}>
            <div style={{fontSize:10,color:T.textMuted,fontWeight:700,letterSpacing:1}}>MACRO SCORE</div>
            <Hint title="Macro Score" icon="📊" color={T.accent}>A score out of 100 based on how close you are to your calorie, protein and fat goals today. Above 70 is great, above 40 is good progress!</Hint>
          </div>
          <div style={{fontSize:30,fontWeight:900,color:macroScore>70?T.green:macroScore>40?T.amber:T.red,marginTop:4}}>{macroScore}<span style={{fontSize:13,color:T.textMuted}}>/100</span></div>
        </Card>
        <Card style={{padding:"12px 14px"}}>
          <div style={{display:"flex",alignItems:"center",gap:6}}>
            <div style={{fontSize:10,color:T.textMuted,fontWeight:700,letterSpacing:1}}>REMAINING</div>
            <Hint title="Calories Remaining" icon="🔥" color={T.accent}>How many more calories you can eat today before reaching your daily goal. Try to end the day close to zero.</Hint>
          </div>
          <div style={{fontSize:30,fontWeight:900,color:T.accent,marginTop:4}}>{calLeft}<span style={{fontSize:13,color:T.textMuted}}>kcal</span></div>
        </Card>
      </div>
      {/* Mode tabs */}
      <Card>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}}>
          <div style={{display:"flex",gap:8,overflowX:"auto",flex:1}}>
            {MODES.map(b=><button key={b.id} onClick={()=>{if(b.id==="barcode")setShowBarcode(true);else if(b.id==="photo")setShowPhoto(true);else{setMode(b.id);setScanned(null);setAiResult(null);}}}
              style={{background:mode===b.id&&b.id!=="barcode"&&b.id!=="photo"?T.accent:"transparent",color:mode===b.id&&b.id!=="barcode"&&b.id!=="photo"?"#080d14":T.textMuted,border:`1px solid ${T.border}`,borderRadius:20,padding:"8px 14px",fontSize:13,fontWeight:700,cursor:"pointer",transition:"all 0.2s",whiteSpace:"nowrap",flexShrink:0}}>{b.l}</button>)}
          </div>
          <Hint title="How to Add Food" icon="🥗" color={T.accent} style={{marginLeft:8,flexShrink:0}}>
            {"🔍 Search DB — search 300,000+ foods by name\n✏️ AI — describe any meal in plain words\n📷 Barcode — scan the barcode on any package\n📸 Photo — take a photo of the package or nutrition label"}
          </Hint>
        </div>
        {busy&&<div style={{textAlign:"center",padding:"20px 0",color:T.textMuted}}><div style={{fontSize:28,marginBottom:8}}>🔍</div>Looking up…</div>}
        {scanErr&&!busy&&<div style={{padding:"12px",background:`${T.red}15`,border:`1px solid ${T.red}44`,borderRadius:10,color:T.red,fontSize:14,marginBottom:12}}>{scanErr}</div>}
        {mode==="search"&&!scanned&&<FoodSearch onAdd={addMeal} profile={profile}/>}
        {mode==="text"&&!busy&&!scanned&&<div style={{display:"flex",gap:10}}>
          <Input value={textInput} onChange={e=>setTextInput(e.target.value)} onKeyDown={e=>e.key==="Enter"&&analyzeText()} placeholder="Describe your meal…"/>
          <Btn onClick={analyzeText} style={{flexShrink:0}}>Go</Btn>
        </div>}
        {aiResult&&mode==="text"&&<div style={{marginTop:14,padding:"14px",background:T.accentGlow,borderRadius:12,border:`1px solid ${T.accentDim}`}}>
          <div style={{fontWeight:700,color:T.text,fontSize:15,marginBottom:8}}>{aiResult.name}</div>
          <div style={{display:"flex",gap:6,flexWrap:"wrap",marginBottom:10}}><Tag color={T.accent}>{aiResult.cal}kcal</Tag><Tag color={T.cyan}>{aiResult.protein}g P</Tag><Tag color={T.amber}>{aiResult.carbs}g C</Tag><Tag color={T.red}>{aiResult.fat}g F</Tag></div>
          {aiResult.insight&&<div style={{fontSize:13,color:T.textMuted,fontStyle:"italic",marginBottom:12}}>💡 {aiResult.insight}</div>}
          <div style={{display:"flex",gap:8}}>
            <Btn onClick={()=>{addMeal(aiResult);setAiResult(null);setTextInput("");}} style={{flex:1}}>Add to Log</Btn>
            <OutlineBtn onClick={saveTemplate}>⭐</OutlineBtn>
          </div>
        </div>}
        {scanned&&!busy&&<ProductCard product={scanned} scanType={scanType} onAdd={(m)=>{addMeal(m);setScanned(null);setMode("search");}} onRescan={()=>{setScanned(null);scanType==="photo"?setShowPhoto(true):setShowBarcode(true);}}/>}
      </Card>
      {/* Templates */}
      {templates.length>0&&<Card><SectionLabel>⭐ QUICK LOG</SectionLabel>
        {templates.map(t=>(
          <div key={t.id} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"12px",background:T.surfaceHigh,borderRadius:12,marginBottom:8}}>
            <div><div style={{fontWeight:600,color:T.text,fontSize:14}}>{t.name}</div><div style={{fontSize:12,color:T.textMuted,marginTop:2}}>{t.cal}kcal · {t.protein}g P</div></div>
            <div style={{display:"flex",gap:8}}>
              <Btn onClick={()=>addMeal(t)} small>+ Log</Btn>
              <OutlineBtn onClick={()=>{const nt=templates.filter(x=>x.id!==t.id);setTemplates(nt);store.set("templates",nt);}} color={T.red} small>✕</OutlineBtn>
            </div>
          </div>
        ))}
      </Card>}
      {/* Log */}
      {meals.length>0&&<Card><SectionLabel>TODAY'S LOG</SectionLabel>
        {meals.map((m,i)=>(
          <div key={i} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"12px 0",borderBottom:i<meals.length-1?`1px solid ${T.border}`:"none"}}>
            <span style={{color:T.text,fontWeight:600,fontSize:14,flex:1,marginRight:10,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{m.name}</span>
            <div style={{display:"flex",gap:6,flexShrink:0}}><Tag color={T.accent}>{m.cal}kcal</Tag><Tag color={T.cyan}>{m.protein}g P</Tag></div>
          </div>
        ))}
      </Card>}
    </div>
  );
}

// ── Workout Section ───────────────────────────────────────────────────────────
function WorkoutSection({onBadge,onWorkoutDone}){
  const[goal,setGoal]=useState(""),[plan,setPlan]=useState(null),[busy,setBusy]=useState(false);
  const[sets,setSets]=useState({}),[restTimer,setRestTimer]=useState(null),[restSecs,setRestSecs]=useState(0);
  const[history,setHistory]=useState(store.get("workout-history")||[]);
  const timerRef=useRef(null);
  const generate=async()=>{if(!goal.trim())return;setBusy(true);setPlan(null);setSets({});
    try{const t=await ai(`Workout for:"${goal}". Return JSON:{"title":"...","duration":"...","exercises":[{"name":"...","sets":3,"reps":"...","rest":60,"tip":"...","targetMuscle":"..."}]}`,"You are an expert trainer. Return only valid JSON.");setPlan(JSON.parse(t));}
    catch{setPlan({title:"Full Body",duration:"45 min",exercises:[{name:"Push-ups",sets:3,reps:"15",rest:60,tip:"Keep core tight",targetMuscle:"Chest"},{name:"Squats",sets:4,reps:"12",rest:90,tip:"Drive through heels",targetMuscle:"Legs"},{name:"Plank",sets:3,reps:"45s",rest:45,tip:"Neutral spine",targetMuscle:"Core"}]});}setBusy(false);};
  const startRest=(secs)=>{clearInterval(timerRef.current);setRestSecs(secs);setRestTimer(secs);timerRef.current=setInterval(()=>setRestTimer(r=>{if(r<=1){clearInterval(timerRef.current);setRestTimer(null);return 0;}return r-1;}),1000);};
  useEffect(()=>()=>clearInterval(timerRef.current),[]);
  const toggleSet=(ei,si,rest)=>{const k=`${ei}-${si}`;const was=sets[k];setSets(p=>({...p,[k]:!p[k]}));if(!was&&rest)startRest(rest);};
  const finishWorkout=()=>{if(!plan)return;const e={title:plan.title,date:new Date().toLocaleDateString(),completedSets:Object.values(sets).filter(Boolean).length};const h=[e,...history].slice(0,20);setHistory(h);store.set("workout-history",h);onBadge("workout_done");onWorkoutDone();};
  const allSets=plan?plan.exercises.reduce((a,ex)=>a+ex.sets,0):0;
  const doneSets=Object.values(sets).filter(Boolean).length;
  return(
    <div style={{display:"flex",flexDirection:"column",gap:14}}>
      {restTimer!==null&&<div style={{position:"fixed",bottom:"calc(90px + env(safe-area-inset-bottom))",right:16,zIndex:50,background:T.surface,border:`2px solid ${T.accent}`,borderRadius:20,padding:"16px 20px",textAlign:"center",boxShadow:"0 8px 32px rgba(0,0,0,0.6)"}}>
        <div style={{fontSize:11,color:T.textMuted,letterSpacing:1,marginBottom:4}}>REST</div>
        <div style={{fontSize:44,fontWeight:900,color:T.accent,lineHeight:1}}>{restTimer}s</div>
        <div style={{background:T.accentDim,borderRadius:4,height:4,marginTop:8}}><div style={{height:"100%",background:T.accent,borderRadius:4,transition:"width 0.9s linear",width:`${(restTimer/restSecs)*100}%`}}/></div>
        <button onClick={()=>{clearInterval(timerRef.current);setRestTimer(null);}} style={{marginTop:10,background:"transparent",border:`1px solid ${T.border}`,color:T.textMuted,borderRadius:8,padding:"6px 16px",cursor:"pointer",fontSize:13,fontWeight:600,width:"100%"}}>Skip</button>
      </div>}
      <Card>
        <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:12}}>
          <div style={{fontWeight:700,color:T.accent,fontSize:13,letterSpacing:1}}>AI WORKOUT GENERATOR</div>
          <Hint title="AI Workout Generator" icon="💪" color={T.accent}>Type your fitness goal in plain words — for example "build chest and shoulders", "30 min cardio for beginners", or "leg day". AI creates a full workout plan with sets, reps, rest times and coaching tips.</Hint>
        </div>
        <div style={{display:"flex",gap:10}}>
          <Input value={goal} onChange={e=>setGoal(e.target.value)} onKeyDown={e=>e.key==="Enter"&&generate()} placeholder="e.g. build shoulders, 30min cardio"/>
          <Btn onClick={generate} disabled={busy} style={{flexShrink:0}}>{busy?"…":"Go"}</Btn>
        </div>
      </Card>
      {plan&&<Card>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
          <div><div style={{fontWeight:800,color:T.text,fontSize:18}}>{plan.title}</div><div style={{color:T.textMuted,fontSize:13}}>⏱ {plan.duration}</div></div>
          <div style={{display:"flex",alignItems:"center",gap:8}}>
            <div style={{textAlign:"right"}}><div style={{fontWeight:800,color:T.accent,fontSize:18}}>{doneSets}/{allSets}</div><div style={{fontSize:11,color:T.textMuted}}>sets done</div></div>
            <Hint title="How to Use" icon="💪" color={T.accent}>Tap the numbered buttons (1, 2, 3…) to mark each set as done. A rest timer appears automatically between sets. When all sets are done, tap Finish Workout to save it to your history.</Hint>
          </div>
        </div>
        <div style={{background:T.surfaceHigh,borderRadius:100,height:6,marginBottom:16}}><div style={{height:"100%",background:T.accent,borderRadius:100,transition:"width 0.5s",width:`${allSets?doneSets/allSets*100:0}%`,boxShadow:`0 0 8px ${T.accent}66`}}/></div>
        {plan.exercises?.map((ex,ei)=>{const done=Array.from({length:ex.sets},(_,si)=>sets[`${ei}-${si}`]).filter(Boolean).length;return(
          <div key={ei} style={{padding:"14px",background:T.surfaceHigh,borderRadius:14,border:`1px solid ${done===ex.sets?T.accent:T.border}`,marginBottom:12,transition:"border 0.3s"}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
              <div><span style={{fontWeight:700,color:T.text,fontSize:15}}>{ex.name}</span>{ex.targetMuscle&&<span style={{marginLeft:8,fontSize:12,color:T.textMuted}}>· {ex.targetMuscle}</span>}</div>
              <span style={{fontSize:12,color:T.textMuted}}>{done}/{ex.sets} · {ex.reps}</span>
            </div>
            <div style={{display:"flex",gap:8,marginBottom:10,flexWrap:"wrap"}}>
              {Array.from({length:ex.sets},(_,si)=>(
                <button key={si} onClick={()=>toggleSet(ei,si,ex.rest)}
                  style={{width:44,height:44,borderRadius:10,background:sets[`${ei}-${si}`]?T.accent:T.surface,color:sets[`${ei}-${si}`]?"#080d14":T.textMuted,border:`1px solid ${sets[`${ei}-${si}`]?T.accent:T.border}`,cursor:"pointer",fontWeight:700,fontSize:15,transition:"all 0.2s"}}>
                  {si+1}
                </button>
              ))}
              <div style={{display:"flex",alignItems:"center",gap:6,marginLeft:"auto"}}>
                <span style={{fontSize:12,color:T.textMuted}}>⏱ {ex.rest}s rest</span>
              </div>
            </div>
            <div style={{fontSize:13,color:T.textMuted,fontStyle:"italic"}}>💡 {ex.tip}</div>
          </div>
        );})}
        {doneSets>0&&<Btn onClick={finishWorkout} style={{width:"100%",background:T.green}}>✓ Finish Workout</Btn>}
      </Card>}
      {history.length>0&&<Card><SectionLabel>📜 HISTORY</SectionLabel>
        {history.slice(0,5).map((h,i)=>(
          <div key={i} style={{display:"flex",justifyContent:"space-between",padding:"12px 0",borderBottom:i<Math.min(history.length,5)-1?`1px solid ${T.border}`:"none"}}>
            <div><div style={{fontWeight:600,color:T.text,fontSize:14}}>{h.title}</div><div style={{color:T.textMuted,fontSize:12}}>{h.date}</div></div>
            <Tag color={T.accent}>{h.completedSets} sets</Tag>
          </div>
        ))}
      </Card>}
    </div>
  );
}

// ── Water Section ─────────────────────────────────────────────────────────────
function WaterSection({water,onAdd,profile,onBadge}){

  const[log,setLog]=useState(store.get(`wlog-${TODAY}`)||[]);
  const addWater=n=>{const e={n,t:new Date().toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"})};const nl=[...log,e];setLog(nl);store.set(`wlog-${TODAY}`,nl);onAdd(n);if(water+n>=goal)onBadge("water_goal");};
  return(
    <div style={{display:"flex",flexDirection:"column",gap:14}}>

        <div style={{display:"flex",justifyContent:"flex-end",marginBottom:8}}>

        </div>

        <div style={{color:T.textMuted,fontSize:14,marginTop:4,marginBottom:16}}>glasses today</div>
        <div style={{background:T.surfaceHigh,borderRadius:100,height:14,overflow:"hidden",marginBottom:16}}>

        </div>

        <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:10}}>

      </Card>}
    </div>
  );
}

// ── Weight Section ────────────────────────────────────────────────────────────

        <Card style={{textAlign:"center",padding:"14px 10px"}}>
          <div style={{display:"flex",justifyContent:"flex-end"}}><Hint title="Log Your Weight" icon="⚖️" color={T.accent}>Weigh yourself at the same time each day (morning is best, before eating). Enter your weight in kg and tap Log. Track consistently for accurate trends.</Hint></div>
          <div style={{color:T.textMuted,fontSize:10,letterSpacing:1}}>LOG</div>

          <button onClick={logW} style={{marginTop:8,width:"90%",background:T.accent,color:"#080d14",border:"none",borderRadius:8,padding:"8px 0",fontWeight:700,cursor:"pointer",fontSize:14}}>Log</button>
        </Card>
      </div>
      {weights.length>1&&<Card>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}}>
          <div style={{display:"flex",alignItems:"center",gap:8}}>
            <SectionLabel style={{margin:0}}>WEIGHT TREND</SectionLabel>

          </div>
          <div style={{display:"flex",gap:6}}>
            {["week","month"].map(v=><button key={v} onClick={()=>setView(v)} style={{background:view===v?T.accent:"transparent",color:view===v?"#080d14":T.textMuted,border:`1px solid ${view===v?T.accent:T.border}`,borderRadius:8,padding:"6px 14px",fontSize:13,fontWeight:600,cursor:"pointer"}}>{v==="week"?"7d":"30d"}</button>)}
          </div>
        </div>
        <div style={{display:"flex",alignItems:"flex-end",gap:4,height:90,marginBottom:14}}>
          {data.map((w,i)=>{const h=max===min?45:((w.kg-min)/(max-min))*70+10;const last=i===data.length-1;return(
            <div key={i} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:4}}>
              <div style={{width:"100%",height:h,background:last?T.accent:T.accentDim,borderRadius:"5px 5px 0 0",transition:"height 0.5s",position:"relative"}}>
                {last&&<div style={{position:"absolute",top:-22,left:"50%",transform:"translateX(-50%)",fontSize:10,color:T.accent,fontWeight:700,whiteSpace:"nowrap"}}>{w.kg}</div>}
              </div>
              <span style={{fontSize:9,color:T.textMuted}}>{w.date?.slice(-2)||""}</span>
            </div>
          );})}
        </div>
        <button onClick={getInsight} disabled={busy} style={{background:T.accentGlow,border:`1px solid ${T.accent}`,color:T.accent,borderRadius:10,padding:"10px",fontWeight:700,cursor:"pointer",fontSize:14,width:"100%"}}>{busy?"Analyzing…":"✦ AI Insight"}</button>
        {insight&&<div style={{marginTop:12,padding:"12px 14px",background:T.accentGlow,borderRadius:10,border:`1px solid ${T.accentDim}`,fontSize:13,color:T.textMuted,lineHeight:1.6}}>{insight}</div>}
      </Card>}
    </div>
  );
}

// Simple translation function - reads current lang from localStorage each time
function L(key){ const lang=localStorage.getItem("nutryx:lang")||"en"; return(LANGS[lang]||LANGS.en)[key]||(LANGS.en)[key]||key; }
function isRTL(){ return (LANGS[localStorage.getItem("nutryx:lang")||"en"]||LANGS.en).dir==="rtl"; }
function getLangFlag(){ return (LANGS[localStorage.getItem("nutryx:lang")||"en"]||LANGS.en).flag; }

// Translate static DOM elements marked with data-i18n or data-i18n-html
function translateStatic(){
  try{
    document.querySelectorAll('[data-i18n]').forEach(el=>{
      const k = el.getAttribute('data-i18n');
      if(k){ const v = L(k); if(v!==undefined) el.textContent = v; }
    });
    document.querySelectorAll('[data-i18n-html]').forEach(el=>{
      const k = el.getAttribute('data-i18n-html');
      if(k){ const v = L(k); if(v!==undefined) el.innerHTML = v; }
    });
    // update install button aria and label if present
    const ib = document.getElementById('install-btn');
    if(ib && ib.getAttribute('data-i18n')){
      const v = L(ib.getAttribute('data-i18n'));
      if(v!==undefined){ ib.textContent = v; ib.setAttribute('aria-label', v); }
    }
  }catch(e){console.warn('translateStatic failed',e);}
}

// Language Switcher Modal
function LangModal({onClose}){
  const cur=localStorage.getItem("nutryx:lang")||"en";
  const apply=(code)=>{
    localStorage.setItem("nutryx:lang",code);
    document.documentElement.dir=LANGS[code].dir;
    document.documentElement.lang=code;
    window.location.reload();
  };
  return(
    <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.9)",zIndex:500,display:"flex",alignItems:"center",justifyContent:"center",padding:24}}>
      <div style={{width:"100%",maxWidth:360,background:T.surface,borderRadius:24,padding:28,border:`1px solid ${T.accent}44`}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:24}}>
          <div style={{fontWeight:800,fontSize:20,color:T.text}}>{L("langTitle")}</div>
          <button onClick={onClose} style={{background:"none",border:"none",color:T.textMuted,fontSize:26,cursor:"pointer",lineHeight:1}}>✕</button>
        </div>
        {Object.entries(LANGS).map(([code,lang])=>(
          <button key={code} onClick={()=>apply(code)} style={{
            width:"100%",display:"flex",alignItems:"center",gap:16,padding:"18px 20px",marginBottom:12,
            background:cur===code?T.accentGlow:T.surfaceHigh,
            border:`2px solid ${cur===code?T.accent:T.border}`,
            borderRadius:16,cursor:"pointer",transition:"all 0.2s",textAlign:"left",
          }}>
            <span style={{fontSize:36}}>{lang.flag}</span>
            <div style={{flex:1}}>
              <div style={{fontWeight:800,color:T.text,fontSize:18}}>{lang.name}</div>
              <div style={{color:T.textMuted,fontSize:13,marginTop:2}}>{code==="ar"?"عربي":code==="de"?"Deutsch":"English"}</div>
            </div>
            {cur===code&&<span style={{color:T.accent,fontSize:24,fontWeight:900}}>✓</span>}
          </button>
        ))}
      </div>
    </div>
  );
}

function getAllData(){
  const keys=[];
  for(let i=0;i<localStorage.length;i++){
    const k=localStorage.key(i);
    if(k&&k.startsWith("nutryx:")){
      try{keys.push({k,v:localStorage.getItem(k)});}catch{}
    }
  }
  return keys;
}

function exportBackup(){
  const data=getAllData();
  const backup={version:1,exportedAt:new Date().toISOString(),appName:"NUTRYX",data};
  const json=JSON.stringify(backup,null,2);
  const blob=new Blob([json],{type:"application/json"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url;
  a.download=`nutryx-backup-${new Date().toISOString().slice(0,10)}.json`;
  document.body.appendChild(a);a.click();
  document.body.removeChild(a);URL.revokeObjectURL(url);
  // Save last backup date
  localStorage.setItem("nutryx:last-backup",new Date().toISOString());
  return data.length;
}

function importBackup(file,onSuccess,onError){
  const reader=new FileReader();
  reader.onload=(e)=>{
    try{
      const backup=JSON.parse(e.target.result);
      if(!backup.data||!Array.isArray(backup.data))throw new Error("Invalid backup file");
      // Clear old data
      const oldKeys=[];
      for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.startsWith("nutryx:"))oldKeys.push(k);}
      oldKeys.forEach(k=>localStorage.removeItem(k));
      // Restore all keys
      backup.data.forEach(({k,v})=>{try{localStorage.setItem(k,v);}catch{}});
      onSuccess(backup.data.length,backup.exportedAt);
    }catch(err){onError(err.message);}
  };
  reader.readAsText(file);
}

function App(){

  const[streaks,setStreaks]=useState({water:0,calories:0,workout:0}),[badges,setBadges]=useState({});
  const[showTour,setShowTour]=useState(false),[showLang,setShowLang]=useState(false),[showSettings,setShowSettings]=useState(false);

  useEffect(()=>{
    const p=store.get("profile"),s=store.get("streaks")||{water:4,calories:2,workout:1},b=store.get("badges")||{};
    const m=store.get(`meals-${TODAY}`)||[];const w=store.get(`water-${TODAY}`)||0;const wts=store.get("weights");
    if(p)setProfile(p);setStreaks(s);setBadges(b);setMeals(m);setWater(w);if(wts&&wts.length)setWeights(wts);
    if(p&&!store.get("tour-done"))setShowTour(true);

    // Backup reminder: warn if no backup in 7 days
    const lastBackup=localStorage.getItem("nutryx:last-backup");
    const daysSince=lastBackup?Math.floor((Date.now()-new Date(lastBackup))/(1000*60*60*24)):null;
    if(p&&(daysSince===null||daysSince>7)){
      // Show reminder after 3 seconds
      setTimeout(()=>{
        const reminder=document.getElementById("backup-reminder");
        if(reminder)reminder.style.display="flex";
      },3000);
    }

    setTimeout(()=>{const splash=document.getElementById("splash");if(splash){splash.classList.add("hidden");setTimeout(()=>splash.remove(),500);}},1500);
    setLoading(false);
  },[]);

  const earnBadge=id=>{if(badges[id])return;const nb={...badges,[id]:true};setBadges(nb);store.set("badges",nb);};
  const addMeal=m=>{const nm=[...meals,m];setMeals(nm);store.set(`meals-${TODAY}`,nm);};
  const addWater=n=>{const nw=Math.min(water+n,20);setWater(nw);store.set(`water-${TODAY}`,nw);};
  const logWeight=kg=>{const nw=[...weights,{kg,date:new Date().toLocaleDateString("en-US",{month:"short",day:"numeric"})}];setWeights(nw);store.set("weights",nw);};
  const today={...meals.reduce((a,m)=>({cal:a.cal+m.cal,protein:a.protein+m.protein,carbs:a.carbs+m.carbs,fat:a.fat+m.fat}),{cal:0,protein:0,carbs:0,fat:0}),water};

    {id:"nutrition",l:"🥗",n:L("food")},

        <div style={{flex:1}}>

          <div style={{color:T.textMuted,fontSize:12,marginTop:2}}>Back up your data to avoid losing it</div>
        </div>
        <button onClick={()=>{setShowSettings(true);document.getElementById("backup-reminder").style.display="none";}} style={{background:T.amber,color:"#080d14",border:"none",borderRadius:8,padding:"7px 14px",fontWeight:800,cursor:"pointer",fontSize:13,flexShrink:0}}>Backup</button>

      </div>

          <div>
            <div style={{fontSize:22,fontWeight:900,color:T.accent,letterSpacing:-0.5}}>NUTRYX</div>

          {tab==="workout"   &&<WorkoutSection onBadge={earnBadge} onWorkoutDone={()=>setStreaks(s=>({...s,workout:s.workout+1}))}/>}
          {tab==="water"     &&<WaterSection water={water} onAdd={addWater} profile={profile} onBadge={earnBadge}/>}

            </button>
          ))}
        </div>
      </div>
    </div>
  );
}

ReactDOM.render(<App/>, document.getElementById("root"));
// Translate static elements that are outside React
setTimeout(()=>{ try{ translateStatic(); }catch(e){} }, 30);
</script>

<script>
// ── Service Worker (offline support) ────────────────────────────────────────
if('serviceWorker' in navigator){
  const swCode = `
    const CACHE = 'nutryx-v1';
    const ASSETS = ['./'];
    self.addEventListener('install', e => {
      e.waitUntil(caches.open(CACHE).then(c => c.addAll(ASSETS).catch(()=>{})));
      self.skipWaiting();
    });
    self.addEventListener('activate', e => {
      e.waitUntil(caches.keys().then(keys => Promise.all(keys.filter(k=>k!==CACHE).map(k=>caches.delete(k)))));
      self.clients.claim();
    });
    self.addEventListener('fetch', e => {
      if(e.request.method !== 'GET') return;
      try{
        const reqUrl = new URL(e.request.url);
        if(reqUrl.origin !== self.location.origin) return;
        if(reqUrl.pathname.startsWith('/api/')) return;
      }catch(err){}
      e.respondWith(caches.match(e.request).then(r => r || fetch(e.request).then(res => {
        if(res && res.ok){
          const clone = res.clone();
          caches.open(CACHE).then(c=>c.put(e.request,clone));
        }
        return res;
      }).catch(()=>caches.match('./'))));
    });
  `;
  const blob = new Blob([swCode], {type:'text/javascript'});
  navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(()=>{});
}

// ── PWA Install prompt ───────────────────────────────────────────────────────
let deferredPrompt = null;
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault(); deferredPrompt = e;
  if(!localStorage.getItem('nutryx:installed')){
    setTimeout(()=>document.getElementById('install-banner')?.classList.add('show'), 3000);
  }
});
document.getElementById('install-btn')?.addEventListener('click', async () => {
  if(!deferredPrompt) return;
  deferredPrompt.prompt();
  const {outcome} = await deferredPrompt.userChoice;
  if(outcome==='accepted') localStorage.setItem('nutryx:installed','1');
  deferredPrompt = null;
  document.getElementById('install-banner')?.classList.remove('show');
});
document.getElementById('dismiss-btn')?.addEventListener('click', () => {
  document.getElementById('install-banner')?.classList.remove('show');
});
window.addEventListener('appinstalled', () => {
  localStorage.setItem('nutryx:installed','1');
  document.getElementById('install-banner')?.classList.remove('show');
});

// ── iOS install hint ──────────────────────────────────────────────────────────
const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;
if(isIOS && !isStandalone && !localStorage.getItem('nutryx:ios-hint')){
  setTimeout(()=>{
    const hint = document.getElementById('ios-hint');
    if(hint) hint.style.display = 'block';
    localStorage.setItem('nutryx:ios-hint','1');
  }, 4000);
}
</script>
